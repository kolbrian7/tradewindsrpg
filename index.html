<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#24170f" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;900&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet" />
    
    <!-- PWA Settings -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Merchants of Med" />
    <link rel="apple-touch-icon" href="/favicon.svg" />

    <title>Merchants of the Mediterranean</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // The offline cache is only for the published game (https). On a local test server it would
      // keep showing an older copy of the game, so there it is switched off and cleared.
      // When you come back to the game, check whether a newer version has been published and load it.
      (function () {
        if (location.protocol !== 'https:') return;
        var mine = (document.querySelector('script[type="module"][src]') || {}).src || '';
        var checking = false;
        function check() {
          if (checking || document.visibilityState !== 'visible' || !mine) return;
          checking = true;
          fetch('/index.html?fresh=' + Date.now(), { cache: 'no-store' }).then(function (r) { return r.text(); }).then(function (html) {
            var m = html.match(/assets\/index-[A-Za-z0-9_-]+\.js/);
            if (m && mine.indexOf(m[0]) === -1) location.reload();
          }).catch(function () {}).then(function () { checking = false; });
        }
        document.addEventListener('visibilitychange', check);
        window.addEventListener('focus', check);
        setInterval(check, 5 * 60 * 1000);
      })();

      if ('serviceWorker' in navigator) {
        if (location.protocol === 'https:') {
          window.addEventListener('load', () => {
            navigator.serviceWorker.register('/sw.js').catch((err) => console.error('Service Worker registration failed:', err));
          });
        } else {
          navigator.serviceWorker.getRegistrations().then((regs) => {
            if (!regs.length) return;
            Promise.all(regs.map((r) => r.unregister()))
              .then(() => (window.caches ? caches.keys().then((keys) => Promise.all(keys.map((k) => caches.delete(k)))) : null))
              .then(() => location.reload());
          });
        }
      }
    </script>
  </body>
</html>
